<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time limit warning demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
      }
      .field {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-weight: 600;
      }
      .check {
        font-weight: 400;
      }
      input:not([type="checkbox"]) {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem;
        font: inherit;
      }
      fieldset {
        margin: 0 0 1rem;
        border: 1px solid currentColor;
      }
      button {
        padding: 0.5rem 1rem;
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Outdoor gear</h1>
      <div role="alert" id="hold-warning" hidden>
        <p>
          Your cart is held for 2 more minutes. Then the items go back in stock.
        </p>
        <button type="button" id="extend">
          Keep my items for 15 more minutes
        </button>
      </div>
      <div role="status" id="hold-expired"></div>
      <p>Rain jacket, €189.00</p>
      <button type="button" id="add">Add to cart</button>
      <p id="count">Cart: 0 items</p>
    </main>
    <script>
      const HOLD_MS = 15 * 60 * 1000;
      const WARN_MS = 2 * 60 * 1000;
      const warning = document.getElementById("hold-warning");
      const expired = document.getElementById("hold-expired");
      const count = document.getElementById("count");
      let items = 0;
      let warnTimer;
      let endTimer;

      function startHold() {
        clearTimeout(warnTimer);
        clearTimeout(endTimer);
        warning.hidden = true;
        warnTimer = setTimeout(() => {
          warning.hidden = false;
        }, HOLD_MS - WARN_MS);
        endTimer = setTimeout(() => {
          items = 0;
          count.textContent = "Cart: 0 items";
          warning.hidden = true;
          expired.textContent =
            "Your cart expired, the items are back in stock.";
        }, HOLD_MS);
      }

      document.getElementById("add").addEventListener("click", () => {
        if (items === 0) startHold();
        items += 1;
        expired.textContent = "";
        count.textContent = `Cart: ${items} items`;
      });

      document.getElementById("extend").addEventListener("click", startHold);
    </script>
  </body>
</html>
