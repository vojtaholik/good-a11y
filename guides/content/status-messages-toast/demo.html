<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Status messages demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --toast: #1a1a1a;
        --toast-fg: #ffffff;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --toast: #f0f0f0;
          --toast-fg: #121212;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      #toast {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        translate: -50% 0;
        display: flex;
        gap: 1rem;
        align-items: center;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: var(--toast);
        color: var(--toast-fg);
        max-width: calc(100vw - 2rem);
        box-sizing: border-box;
      }
      #toast button {
        background: transparent;
        color: var(--toast-fg);
        border-color: var(--toast-fg);
        padding: 0.25rem 0.75rem;
      }
      #toast:not([hidden]) {
        animation: rise 0.2s ease-out;
      }
      @keyframes rise {
        from {
          translate: -50% 1rem;
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #toast:not([hidden]) {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rain jacket</h1>
      <p>Waterproof, breathable, 380 g.</p>
      <p><button type="button" id="add">Add to cart</button></p>
      <p>Items in cart: <span id="count">0</span></p>
    </main>
    <div id="status" role="status" class="visually-hidden"></div>
    <div id="toast" hidden>
      <span id="toast-text" aria-hidden="true"></span>
      <button type="button" id="dismiss">Dismiss</button>
    </div>
    <script>
      const add = document.getElementById("add");
      const count = document.getElementById("count");
      const status = document.getElementById("status");
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toast-text");
      let items = 0;
      let timer;
      let paused = false;

      function announce(message) {
        status.textContent = "";
        setTimeout(() => {
          status.textContent = message;
        }, 50);
      }
      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(() => {
          if (!paused) toast.hidden = true;
        }, 8000);
      }
      function showToast(message) {
        toastText.textContent = message;
        toast.hidden = false;
        schedule();
      }
      add.addEventListener("click", () => {
        items += 1;
        count.textContent = String(items);
        const message =
          "Rain jacket added to cart. " +
          items +
          (items === 1 ? " item" : " items") +
          " in cart.";
        announce(message);
        showToast(message);
      });
      document.getElementById("dismiss").addEventListener("click", () => {
        toast.hidden = true;
        add.focus();
      });
      for (const [type, value] of [
        ["pointerenter", true],
        ["pointerleave", false],
        ["focusin", true],
        ["focusout", false],
      ]) {
        toast.addEventListener(type, () => {
          paused = value;
          if (!value) schedule();
        });
      }
    </script>
  </body>
</html>
