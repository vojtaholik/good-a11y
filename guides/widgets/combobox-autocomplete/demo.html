<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Combobox demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --hl: #dbe6fd;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --hl: #263248;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      .field {
        position: relative;
        max-width: 20rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
        padding: 0.5rem;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--bg);
        color: var(--fg);
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      [role="listbox"] {
        position: absolute;
        left: 0;
        right: 0;
        margin: 0.25rem 0 0;
        padding: 0.25rem;
        list-style: none;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--bg);
        max-height: 12rem;
        overflow-y: auto;
        z-index: 1;
      }
      [role="option"] {
        padding: 0.375rem 0.5rem;
        border-radius: 0.25rem;
        cursor: pointer;
      }
      [role="option"][aria-selected="true"] {
        background: var(--hl);
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Find a store</h1>
      <div class="field">
        <label for="city">City</label>
        <input
          id="city"
          type="text"
          role="combobox"
          autocomplete="off"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="city-list"
        />
        <ul id="city-list" role="listbox" aria-label="Cities" hidden></ul>
      </div>
      <div id="city-status" role="status" class="visually-hidden"></div>
      <p id="chosen"></p>
    </main>
    <script>
      const cities = [
        "Amsterdam",
        "Athens",
        "Barcelona",
        "Berlin",
        "Bratislava",
        "Brno",
        "Brussels",
        "Budapest",
        "Copenhagen",
        "Dublin",
        "Helsinki",
        "Lisbon",
        "Ljubljana",
        "Madrid",
        "Paris",
        "Prague",
        "Riga",
        "Rome",
        "Sofia",
        "Stockholm",
        "Tallinn",
        "Vienna",
        "Vilnius",
        "Warsaw",
        "Zagreb",
      ];
      const input = document.getElementById("city");
      const list = document.getElementById("city-list");
      const status = document.getElementById("city-status");
      const chosen = document.getElementById("chosen");
      let timer;

      function render(matches) {
        list.replaceChildren(
          ...matches.map((city, i) => {
            const li = document.createElement("li");
            li.id = "city-opt-" + i;
            li.setAttribute("role", "option");
            li.setAttribute("aria-selected", "false");
            li.textContent = city;
            return li;
          })
        );
        setOpen(matches.length > 0);
        clearTimeout(timer);
        timer = setTimeout(() => {
          status.textContent =
            matches.length === 0
              ? "No cities found"
              : matches.length +
                (matches.length === 1 ? " city" : " cities") +
                " available";
        }, 300);
      }
      function setOpen(open) {
        list.hidden = !open;
        input.setAttribute("aria-expanded", String(open));
        if (!open) input.removeAttribute("aria-activedescendant");
      }
      const options = () => [...list.querySelectorAll('[role="option"]')];
      const current = () =>
        options().findIndex(
          (o) => o.id === input.getAttribute("aria-activedescendant")
        );
      function highlight(option) {
        for (const o of options())
          o.setAttribute("aria-selected", String(o === option));
        input.setAttribute("aria-activedescendant", option.id);
        option.scrollIntoView({ block: "nearest" });
      }
      function accept(option) {
        input.value = option.textContent;
        chosen.textContent = "Showing stores in " + option.textContent + ".";
        setOpen(false);
      }
      const filter = () => {
        const q = input.value.trim().toLowerCase();
        return q === ""
          ? []
          : cities.filter((c) => c.toLowerCase().startsWith(q));
      };

      input.addEventListener("input", () => render(filter()));
      input.addEventListener("keydown", (e) => {
        const opts = options();
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          if (list.hidden) {
            render(input.value ? filter() : cities);
          }
          const all = options();
          if (all.length === 0) return;
          const i = current();
          const next =
            e.key === "ArrowDown"
              ? (i + 1) % all.length
              : i <= 0
                ? all.length - 1
                : i - 1;
          highlight(all[next]);
        } else if (e.key === "Enter") {
          const i = current();
          if (!list.hidden && i >= 0) {
            e.preventDefault();
            accept(opts[i]);
          }
        } else if (e.key === "Escape") {
          if (!list.hidden) setOpen(false);
          else input.value = "";
        } else if (e.key === "Tab") {
          setOpen(false);
        }
      });
      input.addEventListener("blur", () => setOpen(false));
      list.addEventListener("pointerdown", (e) => e.preventDefault());
      list.addEventListener("click", (e) => {
        const option = e.target.closest('[role="option"]');
        if (option) accept(option);
      });
    </script>
  </body>
</html>
