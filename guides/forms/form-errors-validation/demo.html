<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form errors demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --error: #b3261e;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --error: #ffb4ab;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
      }
      .field {
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
        padding: 0.5rem;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--bg);
        color: var(--fg);
      }
      input[aria-invalid="true"] {
        border-color: var(--error);
        border-width: 3px;
      }
      .error {
        color: var(--error);
        font-weight: 600;
        margin: 0.25rem 0 0;
      }
      #error-summary {
        border: 3px solid var(--error);
        border-radius: 0.375rem;
        padding: 0.75rem 1rem;
        margin-bottom: 1.5rem;
      }
      #error-summary h2 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
      }
      #error-summary a {
        color: var(--error);
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--fg);
        color: var(--bg);
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Create an account</h1>
      <div id="error-summary" hidden>
        <h2 tabindex="-1"></h2>
        <ul></ul>
      </div>
      <form id="signup" novalidate>
        <div class="field">
          <label for="full-name">Full name</label>
          <input
            id="full-name"
            name="name"
            type="text"
            autocomplete="name"
            required
            aria-describedby="full-name-error"
          />
          <p id="full-name-error" class="error" hidden></p>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            aria-describedby="email-error"
          />
          <p id="email-error" class="error" hidden></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            aria-describedby="password-error"
          />
          <p id="password-error" class="error" hidden></p>
        </div>
        <button>Create account</button>
      </form>
      <p id="done" role="status"></p>
    </main>
    <script>
      const form = document.getElementById("signup");
      const summary = document.getElementById("error-summary");
      const summaryHeading = summary.querySelector("h2");
      const summaryList = summary.querySelector("ul");
      const labelOf = (field) =>
        document.querySelector('label[for="' + field.id + '"]').textContent;

      function messageFor(field) {
        const v = field.validity;
        if (v.valueMissing) return "Enter your " + labelOf(field).toLowerCase();
        if (v.typeMismatch)
          return "Enter an email address like name@example.com";
        if (v.tooShort)
          return "Use at least " + field.minLength + " characters";
        return null;
      }
      function showSummary(errors) {
        summaryHeading.textContent =
          errors.length === 1
            ? "There is 1 problem with your details"
            : "There are " + errors.length + " problems with your details";
        summaryList.replaceChildren(
          ...errors.map(({ id, message }) => {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = "#" + id;
            a.textContent =
              labelOf(document.getElementById(id)) + ": " + message;
            li.append(a);
            return li;
          })
        );
        summary.hidden = false;
      }
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const errors = [];
        for (const field of form.elements) {
          if (!field.willValidate || field.tagName === "BUTTON") continue;
          const message = messageFor(field);
          const errorEl = document.getElementById(field.id + "-error");
          if (message === null) field.removeAttribute("aria-invalid");
          else field.setAttribute("aria-invalid", "true");
          errorEl.hidden = message === null;
          errorEl.textContent = message === null ? "" : "Error: " + message;
          if (message !== null) errors.push({ id: field.id, message });
        }
        if (errors.length === 0) {
          summary.hidden = true;
          document.getElementById("done").textContent = "Account created.";
          return;
        }
        showSummary(errors);
        summaryHeading.focus();
      });
      summaryList.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (!link) return;
        event.preventDefault();
        document.getElementById(link.hash.slice(1)).focus();
      });
    </script>
  </body>
</html>
