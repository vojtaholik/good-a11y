<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delivery details demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #4a4a4a;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --muted: #c4c4c4;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
      }
      .field {
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
        font-weight: 600;
      }
      .hint {
        margin: 0 0 0.25rem;
        color: var(--muted);
      }
      .opt {
        font-weight: 400;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"] {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
        padding: 0.5rem;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--bg);
        color: var(--fg);
      }
      fieldset {
        border: 2px solid var(--muted);
        border-radius: 0.375rem;
        margin: 0 0 1.25rem;
        padding: 0.75rem 1rem;
      }
      legend {
        font-weight: 600;
        padding: 0 0.25rem;
      }
      fieldset label {
        font-weight: 400;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.25rem 0;
      }
      input[type="radio"] {
        width: 1.25rem;
        height: 1.25rem;
        accent-color: var(--accent);
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--fg);
        color: var(--bg);
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Delivery details</h1>
      <p>All fields are required unless marked optional.</p>
      <form>
        <div class="field">
          <label for="full-name">Full name</label>
          <input
            id="full-name"
            name="name"
            type="text"
            autocomplete="name"
            required
          />
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <p id="email-hint" class="hint">
            We send the receipt and tracking link here.
          </p>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            aria-describedby="email-hint"
          />
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <p id="phone-hint" class="hint">
            Include the country code, like +420.
          </p>
          <input
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            required
            aria-describedby="phone-hint"
          />
        </div>
        <div class="field">
          <label for="company"
            >Company <span class="opt">(optional)</span></label
          >
          <input
            id="company"
            name="company"
            type="text"
            autocomplete="organization"
          />
        </div>
        <div class="field">
          <label for="postal">Postal code</label>
          <input
            id="postal"
            name="postal"
            type="text"
            inputmode="numeric"
            autocomplete="shipping postal-code"
            required
          />
        </div>
        <fieldset>
          <legend>Delivery speed</legend>
          <label
            ><input
              type="radio"
              name="speed"
              value="standard"
              checked
              required
            />
            Standard, 3 to 5 days</label
          >
          <label
            ><input type="radio" name="speed" value="express" /> Express, next
            day</label
          >
        </fieldset>
        <button>Continue to payment</button>
      </form>
    </main>
  </body>
</html>
