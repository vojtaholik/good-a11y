<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Newsletter - Sunny Bikes</title>
  </head>
  <body>
    <main>
      <h1>Newsletter</h1>
      <form id="signup" action="/hit/native" method="post">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required />
        <p id="error" role="alert"></p>
        <button type="submit">Sign up</button>
      </form>
    </main>
    <script>
      document.getElementById("signup").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("error").textContent = "Wrong.";
        fetch("/hit/fetch", { method: "POST", body: "x" });
        navigator.sendBeacon("/hit/beacon", "x");
        new Image().src = "/hit/image";
      });
      document.getElementById("email").addEventListener("invalid", () => {
        document.getElementById("error").textContent = "Wrong.";
      });
    </script>
  </body>
</html>
