<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus styles demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --band: #1a1a1a;
        --band-fg: #ffffff;
        --focus: #0b57d0;
        --band-focus: #ffd54f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --band: #2a2a2a;
          --band-fg: #ffffff;
          --focus: #8ab4f8;
          --band-focus: #ffd54f;
        }
      }
      html {
        scroll-padding-top: 5rem;
      }
      body {
        margin: 0;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      a {
        color: var(--focus);
      }
      header {
        position: sticky;
        top: 0;
        height: 4rem;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0 1rem;
        background: var(--band);
        color: var(--band-fg);
        z-index: 1;
      }
      header a {
        color: var(--band-fg);
      }
      header :focus-visible {
        outline-color: var(--band-focus);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      section {
        padding: 1rem 0;
        border-bottom: 1px solid var(--fg);
      }
      label {
        display: block;
        font-weight: 600;
      }
      input {
        font: inherit;
        padding: 0.5rem;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--bg);
        color: var(--fg);
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--fg);
        color: var(--bg);
        cursor: pointer;
      }
      .card {
        overflow: hidden;
        border: 2px solid var(--fg);
        border-radius: 0.5rem;
        padding: 1rem;
      }
      .card a:focus-visible {
        outline-offset: -3px;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="#top">Acme</a>
      <a href="#shop">Shop</a>
      <a href="#journal">Journal</a>
    </header>
    <main>
      <h1>Account</h1>
      <section>
        <h2>Profile</h2>
        <label for="display-name">Display name</label>
        <input
          id="display-name"
          name="display-name"
          type="text"
          autocomplete="nickname"
        />
        <p><button type="button">Save profile</button></p>
      </section>
      <section>
        <h2>Orders</h2>
        <p><a href="#order-1042">Order 1042, delivered</a></p>
        <p><a href="#order-1043">Order 1043, on the way</a></p>
      </section>
      <section>
        <h2>Saved items</h2>
        <div class="card"><a href="#rain-jacket">Rain jacket</a></div>
      </section>
      <section>
        <h2>Newsletter</h2>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <p><button type="button">Subscribe</button></p>
      </section>
      <section style="min-height: 120vh">
        <h2>Privacy</h2>
        <p><a href="#delete">Delete my account</a></p>
      </section>
    </main>
  </body>
</html>
