<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swipe to remove demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
      }
      .field {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-weight: 600;
      }
      .check {
        font-weight: 400;
      }
      input:not([type="checkbox"]) {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem;
        font: inherit;
      }
      fieldset {
        margin: 0 0 1rem;
        border: 1px solid currentColor;
      }
      button {
        padding: 0.5rem 1rem;
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      ul {
        padding: 0;
        list-style: none;
      }
      .line {
        display: flex;
        gap: 1rem;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem;
        margin-bottom: 0.5rem;
        border: 1px solid currentColor;
        background: var(--bg);
        touch-action: pan-y;
        user-select: none;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cart</h1>
      <ul id="lines">
        <li class="line">
          <span>Rain jacket</span
          ><button type="button" class="remove">Remove Rain jacket</button>
        </li>
        <li class="line">
          <span>Hiking boot</span
          ><button type="button" class="remove">Remove Hiking boot</button>
        </li>
      </ul>
      <p role="status" id="cart-status" class="visually-hidden"></p>
    </main>
    <script>
      const status = document.getElementById("cart-status");

      function removeLine(row) {
        const name = row.querySelector("span").textContent;
        row.remove();
        status.textContent = `${name} removed from cart`;
        setTimeout(() => {
          status.textContent = "";
        }, 3000);
      }

      function swipeable(row) {
        let startX = null;
        let dx = 0;

        row.addEventListener("pointerdown", (event) => {
          if (event.target.closest("button")) return;
          startX = event.clientX;
          row.setPointerCapture(event.pointerId);
        });

        row.addEventListener("pointermove", (event) => {
          if (startX === null) return;
          dx = Math.min(0, event.clientX - startX);
          row.style.transform = `translateX(${dx}px)`;
        });

        const end = (event) => {
          if (startX === null) return;
          const past = event.type === "pointerup" && -dx > row.offsetWidth / 2;
          startX = null;
          dx = 0;
          row.style.transform = "";
          if (past) removeLine(row);
        };

        row.addEventListener("pointerup", end);
        row.addEventListener("pointercancel", end);
      }

      for (const row of document.querySelectorAll(".line")) {
        row
          .querySelector(".remove")
          .addEventListener("click", () => removeLine(row));
        swipeable(row);
      }
    </script>
  </body>
</html>
