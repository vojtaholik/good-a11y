<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redundant entry demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
      }
      .field {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-weight: 600;
      }
      .check {
        font-weight: 400;
      }
      input:not([type="checkbox"]) {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem;
        font: inherit;
      }
      fieldset {
        margin: 0 0 1rem;
        border: 1px solid currentColor;
      }
      button {
        padding: 0.5rem 1rem;
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <form>
        <h2>Delivery address</h2>
        <div class="field">
          <label for="street">Street and number</label>
          <input
            id="street"
            name="street"
            autocomplete="shipping address-line1"
          />
        </div>
        <div class="field">
          <label for="city">City</label>
          <input id="city" name="city" autocomplete="shipping address-level2" />
        </div>
        <div class="field">
          <label for="postal">Postal code</label>
          <input
            id="postal"
            name="postal"
            autocomplete="shipping postal-code"
          />
        </div>
        <div class="field">
          <label for="country">Country</label>
          <input
            id="country"
            name="country"
            autocomplete="shipping country-name"
          />
        </div>
        <fieldset>
          <legend>Billing address</legend>
          <label class="check">
            <input type="checkbox" id="same" checked />
            Same as delivery address
          </label>
          <div id="billing" hidden>
            <div class="field">
              <label for="billing-street">Street and number</label>
              <input
                id="billing-street"
                name="billing-street"
                autocomplete="billing address-line1"
              />
            </div>
            <div class="field">
              <label for="billing-city">City</label>
              <input
                id="billing-city"
                name="billing-city"
                autocomplete="billing address-level2"
              />
            </div>
            <div class="field">
              <label for="billing-postal">Postal code</label>
              <input
                id="billing-postal"
                name="billing-postal"
                autocomplete="billing postal-code"
              />
            </div>
            <div class="field">
              <label for="billing-country">Country</label>
              <input
                id="billing-country"
                name="billing-country"
                autocomplete="billing country-name"
              />
            </div>
          </div>
        </fieldset>
        <button type="submit">Place order</button>
      </form>
      <p id="placed" role="status"></p>
    </main>
    <script>
      const same = document.getElementById("same");
      const billing = document.getElementById("billing");

      same.addEventListener("change", () => {
        billing.hidden = same.checked;
      });

      document.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("placed").textContent = "Order placed.";
      });
    </script>
  </body>
</html>
