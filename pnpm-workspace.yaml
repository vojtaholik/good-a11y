verifyDepsBeforeRun: error

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@google/genai": true
  esbuild: true
  lefthook: true
  protobufjs: true

# Exact fresh pins that pnpm's release-age check would otherwise hold back.
# One entry per version; a bump replaces its entry rather than adding one.
minimumReleaseAgeExclude:
  - effect@4.0.0
  - "@foldkit/oxlint-plugin@0.15.2"
  - "@effect/platform-node@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/vitest@4.0.0"
  - xstate@6.0.0-alpha.63
  - "@xstate/effect@0.1.0-alpha.6"
  - "@earendil-works/chord@0.86.1"
  - "@earendil-works/pi-agent-core@0.86.1"
  - "@earendil-works/pi-ai@0.86.1"
  - "@earendil-works/pi-coding-agent@0.86.1"
  - "@earendil-works/pi-telemetry@0.86.1"
  - "@earendil-works/pi-tui@0.86.1"
