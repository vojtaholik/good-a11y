<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm before a purchase demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
      }
      .field {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-weight: 600;
      }
      .check {
        font-weight: 400;
      }
      input:not([type="checkbox"]) {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem;
        font: inherit;
      }
      fieldset {
        margin: 0 0 1rem;
        border: 1px solid currentColor;
      }
      button {
        padding: 0.5rem 1rem;
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      dialog {
        max-width: 24rem;
        background: var(--bg);
        color: var(--fg);
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.5);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Outdoor gear</h1>
      <section id="product">
        <h2>Rain jacket</h2>
        <p>€189.00</p>
        <button type="button" id="buy">Buy now</button>
      </section>
      <section id="placed" hidden>
        <h2>Thank you</h2>
        <p>Your order is on its way.</p>
      </section>
    </main>
    <dialog id="confirm-order" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Confirm your order</h2>
      <p>Rain jacket, €189.00, to Jana Nováková, Hlavní 1, 602 00 Brno.</p>
      <form method="dialog">
        <button value="cancel">Cancel</button>
        <button value="place" autofocus>Place order for €189.00</button>
      </form>
    </dialog>
    <script>
      const dialog = document.getElementById("confirm-order");

      document.getElementById("buy").addEventListener("click", () => {
        dialog.returnValue = "";
        dialog.showModal();
      });

      dialog.addEventListener("close", () => {
        if (dialog.returnValue === "place") {
          document.getElementById("product").hidden = true;
          document.getElementById("placed").hidden = false;
        }
      });
    </script>
  </body>
</html>
