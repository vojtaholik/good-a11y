<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Works both ways</title>
    <style>
      @media (orientation: portrait) {
        .aside {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shop</h1>
      <p>
        Every product is listed here with its price, its size and its colour,
        and more text follows so that the main content holds most of the page.
      </p>
    </main>
    <p class="aside">Tip</p>
  </body>
</html>
