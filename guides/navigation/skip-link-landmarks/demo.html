<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop - Acme demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --band: #f3f4f6;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --band: #1f1f1f;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      a {
        color: var(--accent);
      }
      .skip-link {
        position: absolute;
        left: 0.5rem;
        top: 0.5rem;
        z-index: 10;
        padding: 0.5rem 1rem;
        background: var(--fg);
        color: var(--bg);
        font-weight: 600;
        border-radius: 0.375rem;
        transform: translateY(-200%);
      }
      .skip-link:focus {
        transform: none;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      main:focus {
        outline: none;
      }
      header,
      footer {
        background: var(--band);
        padding: 1rem;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 2rem;
        align-items: center;
      }
      nav ul {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      [aria-current="page"] {
        font-weight: 700;
        text-decoration-thickness: 3px;
      }
      main {
        max-width: 48rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .logo {
        font-weight: 800;
        color: var(--fg);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header>
      <a class="logo" href="#home">Acme</a>
      <nav aria-label="Main">
        <ul role="list">
          <li><a href="#shop" aria-current="page">Shop</a></li>
          <li><a href="#journal">Journal</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#cart">Cart</a></li>
        </ul>
      </nav>
      <search>
        <form>
          <label for="q">Search products</label>
          <input id="q" name="q" type="search" />
          <button>Search</button>
        </form>
      </search>
    </header>
    <main id="main" tabindex="-1">
      <h1>Shop</h1>
      <p>New arrivals for the autumn season.</p>
      <h2>Jackets</h2>
      <p><a href="#rain-jacket">Rain jacket</a></p>
      <h2>Boots</h2>
      <p><a href="#hiking-boot">Hiking boot</a></p>
    </main>
    <footer>
      <nav aria-label="Footer">
        <ul role="list">
          <li><a href="#contact">Contact</a></li>
          <li><a href="#accessibility">Accessibility statement</a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
