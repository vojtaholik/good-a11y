<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icon buttons demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --accent: #0b57d0;
        --heart: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --accent: #8ab4f8;
          --heart: #ffb4ab;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      .icon-button {
        display: inline-grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        padding: 0;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      .icon-button svg {
        width: 1.5rem;
        height: 1.5rem;
      }
      .icon-button[aria-pressed="true"] {
        color: var(--heart);
        border-color: var(--heart);
      }
      .icon-button[aria-pressed="true"] .heart {
        fill: currentColor;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--fg);
      }
      .bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      .tip {
        position: relative;
      }
      .tip [role="tooltip"] {
        position: absolute;
        top: calc(100% + 0.25rem);
        left: 50%;
        translate: -50% 0;
        padding: 0.125rem 0.5rem;
        border-radius: 0.25rem;
        background: var(--fg);
        color: var(--bg);
        font-size: 0.875rem;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
      }
      .tip:hover [role="tooltip"],
      .tip:focus-within [role="tooltip"] {
        opacity: 1;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="bar">
        <h1>Your cart</h1>
        <span class="tip">
          <button
            type="button"
            class="icon-button"
            id="fav"
            aria-pressed="false"
            aria-describedby="fav-tip"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                class="heart"
                d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
            <span class="visually-hidden">Save cart for later</span>
          </button>
          <span role="tooltip" id="fav-tip">Save cart for later</span>
        </span>
      </div>
      <ul>
        <li>
          <span id="item-1">Rain jacket</span>
          <button
            type="button"
            class="icon-button"
            aria-label="Remove Rain jacket"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
        </li>
        <li>
          <span id="item-2">Hiking boot</span>
          <button
            type="button"
            class="icon-button"
            aria-label="Remove Hiking boot"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
        </li>
      </ul>
      <p>
        <a href="#help" class="icon-button" aria-label="Help">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle
              cx="12"
              cy="12"
              r="9"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17h.01"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
          </svg>
        </a>
      </p>
      <p id="log" role="status"></p>
    </main>
    <script>
      const fav = document.getElementById("fav");
      const log = document.getElementById("log");
      fav.addEventListener("click", () => {
        const pressed = fav.getAttribute("aria-pressed") === "true";
        fav.setAttribute("aria-pressed", String(!pressed));
      });
      for (const button of document.querySelectorAll("li .icon-button")) {
        button.addEventListener("click", () => {
          const li = button.closest("li");
          log.textContent = li.querySelector("span").textContent + " removed.";
          li.remove();
        });
      }
    </script>
  </body>
</html>
