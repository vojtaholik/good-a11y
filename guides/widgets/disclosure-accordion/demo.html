<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accordion demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --line: #6b6b6b;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --line: #9a9a9a;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      h2 {
        margin: 0;
        border-top: 1px solid var(--line);
      }
      h2 button {
        all: unset;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 1rem 0.25rem;
        font:
          600 1.125rem/1.4 system-ui,
          sans-serif;
        cursor: pointer;
      }
      h2 button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .chevron {
        width: 1rem;
        height: 1rem;
        transition: transform 0.2s;
      }
      [aria-expanded="true"] .chevron {
        transform: rotate(180deg);
      }
      @media (prefers-reduced-motion: reduce) {
        .chevron {
          transition: none;
        }
      }
      .panel {
        padding: 0 0.25rem 1rem;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Frequently asked questions</h1>
      <div class="accordion">
        <h2>
          <button
            type="button"
            aria-expanded="false"
            aria-controls="ship-panel"
            id="ship-button"
          >
            Shipping
            <svg
              class="chevron"
              viewBox="0 0 16 16"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M3 6l5 5 5-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
        </h2>
        <div class="panel" id="ship-panel" hidden="until-found">
          <p>
            Orders ship within two working days.
            <a href="#tracking">Track an order</a>.
          </p>
        </div>
        <h2>
          <button
            type="button"
            aria-expanded="false"
            aria-controls="returns-panel"
            id="returns-button"
          >
            Returns
            <svg
              class="chevron"
              viewBox="0 0 16 16"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M3 6l5 5 5-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
        </h2>
        <div class="panel" id="returns-panel" hidden="until-found">
          <p>
            Unused items can be returned within 30 days.
            <a href="#returns-form">Start a return</a>.
          </p>
        </div>
      </div>
      <p id="tracking">Need more help? Write to support.</p>
      <p id="returns-form">Returns are free within the EU.</p>
    </main>
    <script>
      for (const button of document.querySelectorAll(
        "[aria-controls][aria-expanded]"
      )) {
        const panel = document.getElementById(
          button.getAttribute("aria-controls")
        );
        const set = (open) => {
          button.setAttribute("aria-expanded", String(open));
          if (open) panel.removeAttribute("hidden");
          else panel.setAttribute("hidden", "until-found");
        };
        button.addEventListener("click", () =>
          set(button.getAttribute("aria-expanded") !== "true")
        );
        panel.addEventListener("beforematch", () => set(true));
      }
    </script>
  </body>
</html>
