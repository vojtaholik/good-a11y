<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign-in without puzzles demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
      }
      .field {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-weight: 600;
      }
      .check {
        font-weight: 400;
      }
      input:not([type="checkbox"]) {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem;
        font: inherit;
      }
      fieldset {
        margin: 0 0 1rem;
        border: 1px solid currentColor;
      }
      button {
        padding: 0.5rem 1rem;
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .trap {
        position: absolute;
        left: -10000px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <form id="sign-in">
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
          />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="trap" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>
        <button type="submit">Sign in</button>
        <button type="button" id="email-link">Email me a sign-in link</button>
      </form>
      <p id="result" role="status"></p>
    </main>
    <script>
      const form = document.getElementById("sign-in");
      const result = document.getElementById("result");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (form.website.value !== "" || !form.reportValidity()) return;
        form.hidden = true;
        result.textContent = "Welcome back, you are signed in.";
      });

      document.getElementById("email-link").addEventListener("click", () => {
        result.textContent = "Check your email for a sign-in link.";
      });
    </script>
  </body>
</html>
