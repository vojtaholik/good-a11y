<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal dialog demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #4a4a4a;
        --accent: #0b57d0;
        --danger: #b3261e;
        --surface: #f3f4f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --muted: #c4c4c4;
          --accent: #8ab4f8;
          --danger: #f2b8b5;
          --surface: #1f1f1f;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border: 2px solid var(--fg);
        border-radius: 0.375rem;
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      button.danger {
        border-color: var(--danger);
        color: var(--danger);
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      dialog {
        max-width: min(32rem, calc(100vw - 2rem));
        border: 2px solid var(--fg);
        border-radius: 0.5rem;
        background: var(--bg);
        color: var(--fg);
        padding: 1.5rem;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.6);
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      body.locked {
        overflow: hidden;
      }
      p.muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Project settings</h1>
      <p>Deleting a project removes its files for everyone on the team.</p>
      <p>
        <button type="button" id="open-delete" class="danger">
          Delete project
        </button>
      </p>
      <p class="muted" id="result" role="status"></p>
      <p><a href="#top">Back to top</a></p>
    </main>

    <dialog
      id="delete-dialog"
      aria-labelledby="delete-title"
      aria-describedby="delete-desc"
    >
      <h2 id="delete-title">Delete this project?</h2>
      <p id="delete-desc">
        The project and its 12 files are removed. This cannot be undone.
      </p>
      <form method="dialog" class="actions">
        <button value="cancel" autofocus>Cancel</button>
        <button value="delete" class="danger">Delete</button>
      </form>
    </dialog>

    <script>
      const opener = document.getElementById("open-delete");
      const dialog = document.getElementById("delete-dialog");
      const result = document.getElementById("result");

      opener.addEventListener("click", () => {
        document.body.classList.add("locked");
        dialog.showModal();
      });

      dialog.addEventListener("close", () => {
        document.body.classList.remove("locked");
        result.textContent =
          dialog.returnValue === "delete"
            ? "Project deleted."
            : "Nothing was deleted.";
        opener.focus();
      });

      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close("cancel");
      });
    </script>
  </body>
</html>
