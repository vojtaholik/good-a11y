<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hover popup demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --accent: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f0f0f0;
          --accent: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
      }
      .field {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-weight: 600;
      }
      .check {
        font-weight: 400;
      }
      input:not([type="checkbox"]) {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem;
        font: inherit;
      }
      fieldset {
        margin: 0 0 1rem;
        border: 1px solid currentColor;
      }
      button {
        padding: 0.5rem 1rem;
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .zoom {
        position: relative;
        display: inline-block;
      }
      .zoom img {
        display: block;
        width: 200px;
        height: 200px;
      }
      .zoom-pane {
        position: absolute;
        top: 0;
        left: 100%;
        width: 320px;
        height: 320px;
        border: 1px solid #767676;
        background: var(--bg) no-repeat center / 200%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rain jacket</h1>
      <div class="zoom" id="zoom">
        <img
          id="trigger"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23d8e8dd'/%3E%3Cpath d='M30 25h40l8 20-10 4v31H32V49l-10-4z' fill='%232f6f4f'/%3E%3C/svg%3E"
          width="200"
          height="200"
          alt="Green rain jacket with a hood"
        />
        <div class="zoom-pane" id="pane" hidden></div>
      </div>
      <p>€189.00</p>
    </main>
    <script>
      const zoom = document.getElementById("zoom");
      const pane = document.getElementById("pane");
      const image = document.getElementById("trigger");
      let dismissed = false;

      pane.style.backgroundImage = `url("${image.src}")`;

      zoom.addEventListener("pointerenter", () => {
        if (!dismissed) pane.hidden = false;
      });

      zoom.addEventListener("pointerleave", () => {
        dismissed = false;
        pane.hidden = true;
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !pane.hidden) {
          dismissed = true;
          pane.hidden = true;
        }
      });
    </script>
  </body>
</html>
