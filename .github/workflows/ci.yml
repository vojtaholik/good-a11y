name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install chrome-headless-shell for the browser tests
        run: pnpm chrome:install
      - name: Give chrome-headless-shell an AppArmor profile
        # Ubuntu 24.04 lets only binaries with an AppArmor profile create the user namespaces Chrome's sandbox needs. The system Chrome ships one; the downloaded shell gets the same, scoped to its own path, so it starts with its sandbox on.
        run: |
          shell="$(find ~/.cache/puppeteer/chrome-headless-shell -type f -name chrome-headless-shell | head -n 1)"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile chrome-headless-shell "%s" flags=(unconfined) {\n  userns,\n}\n' "$shell" | sudo tee /etc/apparmor.d/chrome-headless-shell
          sudo apparmor_parser -r /etc/apparmor.d/chrome-headless-shell
      - name: Check and test
        # Serialize Turbo tasks so concurrent Vitest pools do not contend on the CI runner.
        run: pnpm turbo run check test build --concurrency=1
